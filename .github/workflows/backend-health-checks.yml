name: Backend health check

# Manual only — no schedule. Run from: Actions tab → "Backend health check" → Run workflow.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Health check URL to test"
        required: true
        type: string
      use_auth:
        description: "Send Authorization header (uses HEALTH_CHECK_TOKEN secret)"
        required: false
        default: false
        type: boolean

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check backend
        env:
          TARGET_URL: ${{ inputs.url }}
          USE_AUTH: ${{ inputs.use_auth }}
          TOKEN: ${{ secrets.HEALTH_CHECK_TOKEN }}
        run: |
          set -euo pipefail

          if [ "$USE_AUTH" = "true" ]; then
            if [ -z "${TOKEN:-}" ]; then
              echo "::error::HEALTH_CHECK_TOKEN secret is not set"
              exit 1
            fi
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 \
              -H "Authorization: Bearer ${TOKEN}" "$TARGET_URL")
          else
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 "$TARGET_URL")
          fi

          echo "Status code: $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::Health check failed (HTTP $CODE)"
            exit 1
          fi
